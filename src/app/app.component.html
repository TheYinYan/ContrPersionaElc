<div class="div-controls">
  <h1>{{title}}</h1>
  <div class="controls">
    <button (click)="onConetarDesconectar($event)">Conectar corriente vivienda</button>
    <div class="textButton">
      <span>Corriente General: {{ this.corrienteVivienda ? 'Conectada' : 'Desconectada'}}</span>
    </div>
  </div>

  <div class="controls">
    <button (click)="onConetarDesconectarHab($event)">Conectar corriente vivienda</button>
    <div class="textButton">
      <span>Estado recibido: {{ this.corrienteHabitacion ? 'Desconectar' : 'Conectar'}}</span>
    </div>
  </div>
</div>
<app-habitacion [corriente]="this.corrienteHabitacion"></app-habitacion>
